name: Build and Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        default: "vx.x.x"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: DotaKickGSI.exe
            asset_name: DotaKickGSI-Windows.exe
            pyinstaller_args: --noconsole
          - os: ubuntu-latest
            artifact_name: DotaKickGSI
            asset_name: DotaKickGSI-Linux
            pyinstaller_args: ""
          - os: macos-latest
            artifact_name: DotaKickGSI
            asset_name: DotaKickGSI-macOS
            pyinstaller_args: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync

      - name: Build Executable
        run: |
          uv run pyinstaller --onefile ${{ matrix.pyinstaller_args }} --name ${{ matrix.asset_name }} gsi_server.py

      - name: Package Extension (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          PEM_KEY: ${{ secrets.PEM_KEY }}
        run: |
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chromePath)) {
              $chromePath = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $chromePath)) {
              Write-Error "Chrome not found!"
              exit 1
          }
          [System.IO.File]::WriteAllText("extension.pem", $env:PEM_KEY)
          $absExtensionPath = Join-Path -Path $pwd.Path -ChildPath "extension"
          $absKeyPath = Join-Path -Path $pwd.Path -ChildPath "extension.pem"
          Start-Process -FilePath $chromePath -ArgumentList "--pack-extension=`"$absExtensionPath`"", "--pack-extension-key=`"$absKeyPath`"" -Wait -NoNewWindow
          Start-Sleep -Seconds 3
          if (-not (Test-Path "extension.crx")) {
              Write-Error "extension.crx was not created!"
              exit 1
          }

      - name: Upload Extension CRX (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: extension.crx
          path: extension.crx

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: DotaKickGSI-Windows.exe
          path: ./dist

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: DotaKickGSI-Linux
          path: ./dist

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: DotaKickGSI-macOS
          path: ./dist

      - name: Download Extension CRX
        uses: actions/download-artifact@v4
        with:
          name: extension.crx
          path: ./dist

      - name: Zip Browser Extension
        run: |
          zip -r dist/extension.zip extension/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            dist/DotaKickGSI-Windows.exe
            dist/DotaKickGSI-Linux
            dist/DotaKickGSI-macOS
            dist/extension.crx
            dist/extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
